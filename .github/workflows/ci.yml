name: Limulator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Protocols, lifecycle, console, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked development environment
        run: uv sync --locked --python 3.12
      - name: Check Python and browser code
        run: |
          uv run ruff check .
          node --check src/limulator/web/app.js
          node --check website/src/app.js
          node --check website/build.mjs
          node --check website/preview.mjs
      - name: Build project website
        run: npm --prefix website run build
      - name: Test local protocols and workflow contracts
        run: uv run pytest -q
      - name: Build distributable package
        run: uv build
      - name: Check installed wheel entry point
        run: uv run --isolated --no-project --with dist/limulator-0.1.0-py3-none-any.whl limulator --help
